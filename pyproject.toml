[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dcs-mission-harness"
version = "0.1.0"
description = "Portable agent harness for DCS multiplayer mission workflows"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7"]

[project.scripts]
dcs-harness = "dcs_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_harness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", ".agents", ".claude", "tools", "docs", "examples", "AGENTS.md", "CLAUDE.md", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
