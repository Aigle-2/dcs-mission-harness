name: Local validation and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.10.5
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python tools/sync_skills.py --check
      - run: uv run dcs-harness validate --kind mission --file examples/mission.yaml --profile examples/profile.yaml
      - run: uv run dcs-harness publish check --tracked --history
